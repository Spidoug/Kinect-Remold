# SynKinect Studio - shared per-Kinect spatial-audio policy
ui.frameRate=30
lifecycle.workerJoinMs=1200
transport.reconnectMs=300
transport.pipeOpenAttempts=4
transport.pipeOpenRetryMs=75
transport.noFrameWarningMs=4000
transport.connectionStaleMs=9000

scan.soundSpeedMps=343.0
scan.minimumRms=0.0018
scan.occupancyDecay=0.94
geometry.microphoneXM=0.113,-0.036,-0.076,-0.113

# Localization uses band-limited SRP/GCC-PHAT and scores each microphone pair
# by correlation-peak sharpness so unreliable pairs contribute less.
localization.lowHz=120
localization.highHz=4200
localization.pairWeightFloor=0.20
localization.pairSharpnessGain=1.55

# Temporal source tracking rejects isolated angular jumps while remaining fast
# when confidence is strong. Position smoothing only affects the displayed x/z estimate.
tracking.slowAlpha=0.10
tracking.fastAlpha=0.58
tracking.maxJumpDeg=24
tracking.minStability=0.38
tracking.positionAlpha=0.22

# Voice activity detection. AUTO never steers on raw loudness alone.
voice.lowHz=100
voice.highHz=3600
voice.bandMinRatio=0.56
voice.flatnessMax=0.72
voice.coherenceMin=0.26
voice.zcrMin=0.015
voice.zcrMax=0.32
voice.snrOnDb=10.0
voice.snrOffDb=6.0
voice.probability=0.68
voice.attackFrames=5
voice.releaseFrames=14
voice.noiseAdaptDown=0.16
voice.noiseAdaptUp=0.006

# Near-field localization search.
locate.xMinM=-2.5
locate.xMaxM=2.5
locate.zMinM=0.30
locate.zMaxM=4.0
locate.xSteps=51
locate.zSteps=38

# Voice-aware AUTO beam steering.
beam.autoConfidence=0.075
beam.autoMaxSpreadDeg=8.0
beam.autoDeadbandDeg=7.0
beam.autoMaxSlewDegPerSec=35.0
beam.autoDwellFrames=16
beam.autoHoldMs=1200
beam.autoUpdateMinMs=90
beam.outputGain=1.25
beam.queueFrames=10
beam.lineBufferBytes=8192

# Adaptive spectral noise suppression after the spatial beamformer.
noise.enabled=true
noise.overSubtract=1.35
noise.minGain=0.10
noise.adapt=0.035
noise.speechAdapt=0.0015
