# SynKinect Studio - NUI20 kinematic depth fusion + calibrated RGB overlay
transport.workerJoinMs=2200
transport.streamStaleMs=1800
vision.previewHz=15
vision.minDepthMm=550
vision.maxDepthMm=3800

# NUI20 kinematic fusion tracker. Multiple depth-person hypotheses are evaluated
# every frame and identity is stabilized by depth/center affinity, temporal filtering
# and anthropometric bone constraints. Interactivity is gated only by torso/arms/hands;
# all leg joints remain identified and published in the full 20-joint skeleton.
pose.minCoreConfidence=0.32
pose.occlusionHoldFrames=12
pose.filterMinAlpha=0.08
pose.filterMaxAlpha=0.82
pose.velocityAlpha=0.22
pose.maxSpeedMps=4.2
pose.oneEuroMinCutoff=0.90
pose.oneEuroBeta=0.58
pose.oneEuroDerivativeCutoff=1.0
pose.geodesicDepthPenalty=1.15
pose.medialPenalty=0.85
pose.crossBodyPenalty=1.85
pose.temporalEndpointBias=1.05
pose.minArmPathRatio=0.52
pose.minLegPathRatio=0.82
pose.innovationGateM=0.22
pose.jitterRadiusM=0.010
pose.boneLearnAlpha=0.075
pose.boneCorrection=0.68
pose.maxDirectionJumpDeg=68
body.temporalCenterPx=120
body.temporalDepthM=0.45
body.sampleStep=4
body.depthBinMm=80
body.depthBandMm=520
body.depthHypotheses=4
body.continuityMm=320
body.minSamples=90
body.minHeightPx=100
body.histogramCapSamples=1400
body.maxWidthRatio=0.86
body.centerBias=0.70
body.minAspect=0.82

# Local metric-depth hand contour analysis: palm support, fingertip extrema, openness/grab and pinch cues for interaction gestures.
hand.localRadiusPx=22
hand.depthToleranceMm=150
hand.openRadiusMinPx=10
hand.openRadiusMaxPx=28

cursor.mirrorX=true
cursor.hand=right
cursor.maxHz=60
cursor.lostReleaseMs=800
cursor.deadzonePx=1.8
cursor.fastAlpha=0.62
cursor.slowAlpha=0.20
cursor.fastDistancePx=42
cursor.volumeHalfWidthM=0.55
cursor.volumeTopM=0.42
cursor.volumeBottomM=0.48
cursor.minHandForwardM=0.015

gesture.openThreshold=0.62
gesture.closeThreshold=0.38
gesture.twoHandStableMs=180
gesture.doubleClickStableMs=170
gesture.doubleClickCooldownMs=700
gesture.scrollCooldownMs=45
gesture.scrollThresholdM=0.018
gesture.scrollGainPerM=82.0

cloud.particles=300
cloud.trailSamples=22
cloud.radiusPx=24
cloud.spring=42
cloud.damping=7
cloud.flow=0.24
cloud.trailStrength=1
cloud.stretchGain=0.020
cloud.maxStretch=3
