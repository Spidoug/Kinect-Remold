# SynKinect Studio - interaction, gestures and desktop control
transport.workerJoinMs=2200
transport.streamStaleMs=1800
vision.previewHz=15

cursor.mirrorX=false
cursor.hand=auto

# Tracking category. Auto keeps body-level hands everywhere and enables the
# near-field hands/fingers refinement when a seated person is close to Kinect.
tracking.category=auto
handsFingers.autoRequireSeated=false
handsFingers.autoPersonMaxM=1.65
cursor.lostReleaseMs=1200
cursor.autoHandSwitchMs=650
cursor.autoHandScoreMargin=0.14
cursor.minBodyConfidence=0.38
cursor.minHandConfidence=0.34
cursor.fineHandConfidence=0.58
# Physical interaction zone (Kinect SDK style). Each hand has its own zone,
# anchored at its shoulder and sized in fractions of the user's arm length, so the
# mapping is identical for any body size and any distance from the sensor.
zone.widthArm=1.05
zone.heightArm=0.95
zone.topArm=0.22
zone.outwardArm=0.10
# A hand controls only when raised in front of the body.
engage.forwardArm=0.16
engage.belowShoulderArm=0.95
engage.aboveShoulderArm=0.75
# Raising the hand never clicks: presses are ignored right after engaging.
engage.settleMs=250

# Press = relative push toward the sensor (adaptive baseline + hysteresis).
# The pointer is locked while pushing so clicks land where the user aimed.
press.deltaArm=0.15
press.releaseArm=0.07
press.lockFraction=0.35
press.lockLookbackMs=120
press.stableMs=60
press.baselineRiseS=1.2
press.baselineFallS=0.25
press.dragUnlock=0.07
# A push must move mostly along the pointing axis (planar motion < ratio x push).
press.directionWindowMs=150
press.directionRatio=0.8
press.baselineSidewaysS=0.35
# The pointer stays on the click target while the hand is pulled back.
press.releaseHoldMs=220

# One-Euro pointer filter (steady at rest, no lag in fast motion).
pointer.minCutoffHz=0.9
pointer.beta=0.012
pointer.derivativeCutoffHz=1.0
pointer.dragStartPx=14

# Second hand: push = right click, push while the first hand is pressed = double
# click, raised to shoulder height and moved up/down = scroll (joystick).
gesture.rightClick=true
gesture.doubleClickWindowMs=600
scroll.raiseArm=0.10
scroll.deadbandArm=0.07
scroll.gainPerArm=70
scroll.maxNotchesPerSec=14

# Air keyboard: both hands have their own cursor; push to type. Hold both hands
# above the head for toggleHoldMs to show/hide it. dwellMs>0 enables dwell typing.
keyboard.widthFraction=0.62
keyboard.sideOffset=0.22
keyboard.zoneScale=1.10
keyboard.dwellMs=0
keyboard.repeatDelayMs=520
keyboard.repeatMs=90
keyboard.gestureToggle=true
keyboard.toggleHoldMs=1200

# Nominal Body3D framing. A presentation-only safety fit may zoom out to keep the
# tracked body inside the panel; it never changes depth-driven pointer gain or tracking.
view.bodyTargetOccupancy=0.84
view.bodyArmOccupancy=0.86
view.bodyCenterYOffsetM=-0.03

# Interactivity uses a fixed nominal metric frame. The detection/view reference is
# deliberately locked to 1.10 m; current body depth never changes zoom.
view.referenceDistanceM=1.10
view.fixedHeightM=2.10
view.fixedWidthM=2.10
