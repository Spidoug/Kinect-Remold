# SynKinect Studio - interaction, gestures and desktop control
transport.workerJoinMs=2200
transport.streamStaleMs=1800
vision.previewHz=15

cursor.mirrorX=true
cursor.hand=auto
cursor.maxHz=60
cursor.lostReleaseMs=1200
cursor.autoHandSwitchMs=450
cursor.autoHandScoreMargin=0.12
# Pointer filter: stable while hovering, responsive during intentional motion.
cursor.deadzonePx=1.6
cursor.stationaryDeadzonePx=4.0
cursor.fastAlpha=0.68
cursor.slowAlpha=0.14
cursor.fastDistancePx=46
cursor.predictionMs=8
cursor.maxJumpPx=120
cursor.confidenceFloor=0.25
cursor.steadySpeedPxPerSec=95
cursor.maxSpeedPxPerSec=4200
cursor.maxAccelPxPerSec2=22000
cursor.volumeHalfWidthM=0.55
cursor.volumeTopM=0.42
cursor.volumeBottomM=0.48
cursor.minHandForwardM=0.0

gesture.pressForwardM=0.16
gesture.releaseForwardM=0.09
gesture.twoHandStableMs=180
gesture.doubleClickStableMs=170
gesture.doubleClickCooldownMs=700
gesture.scrollCooldownMs=45
gesture.scrollThresholdM=0.018
gesture.scrollGainPerM=82.0

# Frontend-only Body3D framing. The bounded metric envelope adapts to posture and
# live limb extents without feeding viewport transforms back into SynSkeleton.
view.bodyMinHeightM=0.92
view.bodyMinWidthM=0.72
view.bodyMaxHeightM=2.30
view.bodyMaxWidthM=2.05
view.bodyTargetOccupancy=0.84
view.bodyArmOccupancy=0.86
view.bodyCenterYOffsetM=-0.03

# Normal changes are damped. A large expansion (for example an arm raised quickly)
# gets an emergency zoom-out so the limb remains inside the 3D viewport. Zoom-in is
# delayed and deliberately slower to prevent breathing around temporary occlusions.
view.autoFit.zoomOutResponse=0.24
view.autoFit.emergencyZoomOutResponse=0.72
view.autoFit.emergencyRatio=0.82
view.autoFit.zoomInResponse=0.032
view.autoFit.centerResponse=0.075
view.autoFit.deadband=0.045
view.autoFit.shrinkDelayFrames=24
