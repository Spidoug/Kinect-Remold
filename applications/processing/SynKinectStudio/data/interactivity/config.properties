# SynKinect Studio - interaction, gestures and desktop control
transport.workerJoinMs=2200
transport.streamStaleMs=1800
vision.previewHz=15

cursor.mirrorX=true
cursor.hand=auto
cursor.maxHz=60
cursor.lostReleaseMs=800
# AUTO keeps the currently dominant tracked hand until the opposite hand is
# consistently better, preventing left/right flapping during occlusion.
cursor.autoHandSwitchMs=450
cursor.autoHandScoreMargin=0.12
# Precision filter: larger stationary dead-zone removes tremor; the smaller
# moving dead-zone and bounded prediction keep pointer response fast.
cursor.deadzonePx=1.8
cursor.stationaryDeadzonePx=3.0
cursor.fastAlpha=0.62
cursor.slowAlpha=0.20
cursor.fastDistancePx=42
cursor.predictionMs=10
cursor.maxJumpPx=140
cursor.confidenceFloor=0.25
cursor.volumeHalfWidthM=0.55
cursor.volumeTopM=0.42
cursor.volumeBottomM=0.48
cursor.minHandForwardM=0.015

gesture.pressForwardM=0.16
gesture.releaseForwardM=0.09
gesture.twoHandStableMs=180
gesture.doubleClickStableMs=170
gesture.doubleClickCooldownMs=700
gesture.scrollCooldownMs=45
gesture.scrollThresholdM=0.018
gesture.scrollGainPerM=82.0

cloud.particles=300
cloud.trailSamples=22
cloud.radiusPx=24
cloud.spring=42
cloud.damping=7
cloud.flow=0.24
cloud.trailStrength=1
cloud.stretchGain=0.020
cloud.maxStretch=3
