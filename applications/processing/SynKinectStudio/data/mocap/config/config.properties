# SynKinect Studio Motion Capture configuration (see docs/MOTION-CAPTURE.md)
# All sockets bind to bindAddress. Keep 127.0.0.1 unless another machine must
# receive the stream (the streams are unauthenticated).
bindAddress=127.0.0.1

# VMC protocol (OSC/UDP) -> VSeeFace, VirtualMotionCapture, EVMC4U, VMC4B, VMC4UE
vmc.enabled=true
vmc.host=127.0.0.1
vmc.port=39539
# Ports offered by the "VMC port" button
vmc.presets=39539,39540

# Plain OSC joints (/synkinect/frame, /synkinect/joint, /synkinect/bone)
osc.enabled=false
osc.host=127.0.0.1
osc.port=39542

# JSON over UDP, one datagram per frame
json.enabled=false
json.host=127.0.0.1
json.port=39541
# unity = humanoid bones (Unity space); camera = Kinect v1 joints (camera space). Also used by WebSocket.
json.space=unity

# WebSocket server ws://<bindAddress>:<ws.port>/
ws.enabled=true
ws.port=39540

# Avatar mirrors the user (user's left hand drives the avatar's right hand)
mirror=false
# Place the avatar at the origin when a new body is acquired (walking still moves it)
root.center=true
# Maximum frames per second per sink (60 or more = every solved frame)
sendRate=60
vision.previewHz=15
