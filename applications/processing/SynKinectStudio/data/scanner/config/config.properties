ui.frameRate=30
# Studio UI typography is resolved against installed system fonts at runtime.
lifecycle.workerJoinMs=1500
# SynKinect 3D Scanner runtime configuration.

# Metric depth / Kinect calibration
# Near-object policy: do not discard valid short-range samples. The physical
# Kinect 1414 optical minimum still applies; software cannot invent depth where
# the sensor returns 0/invalid.
depth.minM=0.20
depth.maxM=4.50
# Kinect v1 structured-light noise model sigma(z) = base + quad * z^2 (metres).
# Used to judge TSDF surface agreement relative to the expected noise at each depth.
depth.noiseBaseM=0.0008
depth.noiseQuadM=0.0019
depth.plausibleMinMm=180
depth.plausibleMaxMm=6000
depth.minimumValidPixels=1200
depth.minimumValidRatio=0.004
depth.histogramBinMm=20
calibration.depth.fx=594.2143421192325
calibration.depth.fy=591.0405369687078
calibration.depth.cx=339.30780975300314
calibration.depth.cy=242.73913761751615
calibration.depth.scale=0.001

# Foreground target acquisition
target.bandM=0.20
target.maxBandM=0.34
target.smoothing=0.12
target.stableToleranceM=0.12
target.maxJumpM=0.24
target.minimumConfidence=0.040
target.minimumSamples=80
target.stableFrames=3
target.reacquireFrames=6
# During Scan the selected foreground object stays locked by depth; temporary
# occlusion does not promote a distant wall to target.
target.captureLostFrames=18
target.captureMaxJumpM=0.32
target.captureSmoothing=0.08
target.roi.left=0.24
target.roi.right=0.76
target.roi.top=0.20
target.roi.bottom=0.80
target.roi.sampleStep=2
target.preferredWindowM=0.24
# Keep target depth-band growth controlled. The previous 3x spread expansion
# could reach almost one meter total depth and merge the object with support/background.
target.bandSpreadMultiplier=1.80
# Segmentation may extend beyond the acquisition ROI, but not across the full FOV.
target.segmentationMargin=0.10
# The subject is the NEAREST significant depth mode in the ROI (mass >= this
# fraction of the strongest mode), not simply the strongest one: a flat wall
# behind the object is often the largest histogram peak.
target.preferNearest=true
target.nearestModeFraction=0.30

# Transport liveness
transport.streamStaleMs=2400
transport.connectionStaleMs=3000
transport.reconnectMs=180

fusion.queueFrames=1
fusion.maxFps=20

# Point cloud / ICP
# Real-time profile: fusion keeps TSDF resolution but samples every second depth pixel.
# ICP cell size matches max correspondence distance, avoiding a 7x7x7 hash search.
cloud.previewStep=3
cloud.integrationStep=2
cloud.spatialFilter=true
cloud.neighborToleranceM=0.045
cloud.minimumConfidence=0.18
cloud.edgeSoftM=0.010
cloud.edgeRejectM=0.026
cloud.surfaceNoiseM=0.010
cloud.minimumSupport=0.62
# Keep only the dominant connected target surface inside the depth band. This
# prevents same-depth background islands from entering ICP/TSDF during a turn.
cloud.connectedTarget=true
cloud.componentMinSamples=70
# Neighboring pixels only belong to one 3D component when their metric depth is
# continuous. This breaks false object<->table/wall bridges at occlusion edges.
cloud.componentDepthLinkM=0.045
cloud.componentBorderPenalty=0.42
tracking.minimumPoints=320
tracking.icpIterations=7
tracking.icpMinimumMatches=100
tracking.icpCellSizeM=0.055
tracking.icpMaxDistanceM=0.055
tracking.icpMaxSamples=2400
tracking.icpGoodRmsM=0.022
# Realtime ICP tracks against a short rolling world-space model instead of only
# the immediately previous frame. Trimmed correspondences reduce outlier-driven
# pose jumps on reflective edges and structured-light dropouts.
tracking.icpReferenceFrames=3
tracking.icpReferenceMaxPoints=6000
tracking.icpTrimFraction=0.70
# Require real geometric overlap; new/occluded surfaces may change while the object turns.
tracking.icpMinimumOverlap=0.22
# Tukey-style robust weighting radius as a fraction of the current correspondence gate.
tracking.icpRobustK=0.62
tracking.icpReciprocal=true
tracking.icpReciprocalToleranceM=0.016
# Turntable: the metric target cube seeds the physical rotation axis immediately.
# Robust ICP remains active and may keep a small bounded XYZ residual so human
# sway, breathing and clothing deformation can align without allowing those local
# changes to drag the global axis into a spiral or duplicate shell.
tracking.turntable.enabled=true
tracking.turntable.maxSeedYawDeg=36.0
tracking.turntable.seedSearchWindowDeg=16.0
tracking.turntable.seedMaxSamples=1100
tracking.turntable.coarseStepDeg=3.0
tracking.turntable.fineStepDeg=0.50
tracking.turntable.motionAlpha=0.40
tracking.turntable.predictionWeight=0.30
tracking.turntable.seedMinGain=0.0025
tracking.turntable.seedMinimumConfidence=0.07
tracking.turntable.seedPoseAuthority=0.82
tracking.turntable.seedMinTrackedYawDeg=0.06
tracking.turntable.velocityClampDeg=8.0
tracking.turntable.pivotAlpha=0.035
tracking.turntable.evaluationDistanceM=0.040
# Yaw/pivot is the global motion prior. Small robust translational residuals are
# retained for non-rigid subjects; large pitch/roll/XYZ drift is suppressed.
tracking.turntable.poseConstraint=true
tracking.turntable.modelRefinement.enabled=true
tracking.turntable.modelRefinement.everyFrames=3
tracking.turntable.modelRefinement.maxCorrectionM=0.16
tracking.turntable.modelRefinement.maxCorrectionDeg=16.0
tracking.turntable.modelRefinement.minOverlap=0.08
tracking.turntable.modelRefinement.maxRmsM=0.022
# Close the 360-degree loop explicitly against the first accepted world-space
# view. This arrests residual frame-to-frame/TSDF drift before it becomes a
# second displaced shell at the end of the revolution.
tracking.turntable.loopClosure.enabled=true
tracking.turntable.loopClosure.startDeg=318.0
tracking.turntable.loopClosure.everyFrames=4
tracking.turntable.loopClosure.distanceM=0.050
tracking.turntable.loopClosure.maxRmsM=0.020
tracking.turntable.loopClosure.maxCorrectionM=0.12
tracking.turntable.loopClosure.maxCorrectionDeg=14.0
tracking.turntable.constraintScoreSlack=0.18
tracking.turntable.constraintTranslationM=0.022
tracking.turntable.constraintTranslationAuthority=0.42
tracking.turntable.integrationMinYawDeg=0.75
tracking.turntable.pivotConsensusSamples=5
# Turntable tracking follows KinectFusion/Skanect: frame-to-model point-to-plane
# ICP against the fused TSDF. With the support plane known, motion is limited to
# the physical turntable DOF: rotation about the plane normal plus translation in
# the plane (3-DoF). This needs no pivot estimate, and tilt/vertical drift cannot occur.
tracking.turntable.modelTracking.enabled=true
tracking.turntable.modelTracking.maxRmsM=0.0065
tracking.turntable.modelTracking.minOverlap=0.30
tracking.turntable.planarMotion=true
# The pre-scan metric cube provides a pivot seed; depth/ICP consensus refines it
# after enough angular baseline is available.
tracking.turntable.pivotCalibration.enabled=true
tracking.turntable.pivotCalibrationDeg=38
tracking.turntable.pivotCalibrationToleranceM=0.006
tracking.turntable.pivotCalibrationMaxShiftM=0.16

# Turntable object isolation: metric Volume Of Interest in camera space.
# It starts from the target and follows the observed center slowly so an eccentric
# chair/body rotation is not clipped; this ROI motion does not move world geometry.
tracking.boundingBox.enabled=true
tracking.boundingBox.marginM=0.045
tracking.boundingBox.depthMarginM=0.035
tracking.boundingBox.baseExtraM=0.075
tracking.boundingBox.minWidthM=0.24
tracking.boundingBox.minHeightM=0.24
tracking.boundingBox.minDepthM=0.16
tracking.boundingBox.maxWidthM=1.30
tracking.boundingBox.maxHeightM=2.10
tracking.boundingBox.maxDepthM=1.00
tracking.boundingBox.centerFollowAlpha=0.02
tracking.boundingBox.maxCenterCorrectionM=0.035
tracking.boundingBox.minPoints=140
# Support plane (table/floor) under the subject, estimated by gravity-guided
# RANSAC while the Kinect is idle. Turntable removes it from every ROI query (it
# is static and would otherwise hold ICP at zero rotation) and freezes it for the
# capture. Kinect Fusion uses it only to frame the subject before Scan.
tracking.supportPlane.enabled=true
tracking.supportPlane.sampleStep=6
tracking.supportPlane.iterations=160
tracking.supportPlane.maxTiltDeg=25
tracking.supportPlane.inlierM=0.006
tracking.supportPlane.minInliers=350
tracking.supportPlane.minInlierRatio=0.06
tracking.supportPlane.clearanceM=0.008
tracking.supportPlane.refreshMs=900

# Optional realtime geometry/color ICP. Disabled by default because depth geometry
# is authoritative and RGB registration is deferred to accepted integration frames,
# avoiding an expensive RGB decode/registration on every tracking frame.
tracking.colorIcp.enabled=false
tracking.colorIcp.weight=0.28
tracking.colorIcp.rejectDistance=0.62
tracking.colorIcp.minimumWeight=0.22

# Y has low authority when selecting yaw; full 6DoF ICP still captures real height variation.
tracking.turntable.verticalResidualWeight=0.55

# Final reconstruction policy. Create Mesh is the low-latency path and extracts
# the coherent live TSDF directly. Refine HQ is the explicit offline path: retained
# RGB-D keyframes are globally re-registered, weak poses are recovered/rejected,
# and a fresh high-resolution TSDF is fused from the corrected set.
quality.enabled=true
quality.keyframes.max=220
quality.keyframes.minRotationDeg=1.25
quality.keyframes.minTranslationM=0.003
quality.keyframes.minimum=16
quality.finalizeMaxKeyframes=120
quality.integrationStep=1
quality.volumeSize=240
quality.voxelSizeM=0.0021
quality.truncationM=0.0075
quality.meshMinimumWeight=4
quality.icpIterations=15
quality.icpMaxSamples=16000
quality.icpMinimumMatches=280
quality.icpMaxDistanceM=0.024
quality.icpTrimFraction=0.72
quality.icpGoodRmsM=0.0095
# Global pose recovery uses the recorded sweep angle only as a geometric prior.
# ICP is free to repair substantial realtime drift, but must remain inside a broad
# physical envelope and agree with neighboring keyframes before final fusion.
quality.globalRecovery.enabled=true
quality.globalRecovery.passes=3
quality.globalRecovery.neighborFrames=5
quality.globalRecovery.coarseDistanceM=0.075
quality.globalRecovery.fineDistanceM=0.020
quality.globalRecovery.maxTranslationM=0.18
quality.globalRecovery.maxRotationDeg=36.0
quality.globalRecovery.minSupport=0.34
quality.globalRecovery.maxRmsM=0.012
quality.loopClosure=true
quality.loopClosureMaxRmsM=0.013
quality.depthFilterRadius=2
quality.depthEdgeToleranceM=0.018
quality.holeFillMinimumNeighbors=14
quality.distanceWeightedTsdf=true
quality.tsdf.minimumPointConfidence=0.30
quality.tsdf.confidenceGamma=1.75
# Multi-frame depth super-resolution. Neighboring calibrated keyframes are
# transformed into a common anchor camera after global pose refinement and
# accumulated on a 2x subpixel grid. Foreground z-buffering rejects occluded
# background samples; a tighter temporal gate rejects inconsistent depth.
quality.depthSuperResolution.enabled=true
quality.depthSuperResolution.scale=2
quality.depthSuperResolution.windowFrames=7
quality.depthSuperResolution.anchorStride=2
quality.depthSuperResolution.maxRotationDeg=6.0
quality.depthSuperResolution.maxTranslationM=0.030
quality.depthSuperResolution.occlusionToleranceM=0.010
quality.depthSuperResolution.outlierToleranceM=0.007
quality.depthSuperResolution.minimumViews=3
quality.depthSuperResolution.maxPoints=520000
# Keep final smoothing deliberately light: the higher-resolution TSDF should
# preserve small features while limiting aggressive smoothing.
quality.meshPolishIterations=1
quality.meshPolishLambda=0.14
quality.meshPolishMu=-0.145

# Per-device metric depth calibration (docs/SENSOR-CALIBRATION.md). A flat wall is
# captured at several distances; each station is reduced to a robust per-pixel depth
# (trimmed temporal mean, flying-pixel rejection). Planes are fitted in inverse depth
# over the undistorted rays and the non-planar residual is modelled in inverse depth on
# a gridX x gridY control grid x depthBins disparity bins with Laplacian smoothing.
# regularization=0 selects the smoothing weight by leave-one-station-out validation.
# Absolute scale needs a tape-measured reference distance entered in the window.
# planeResidualMaxM is an inverse-depth RMS referenced to 1 m. slopeMin/slopeMax and
# offsetMaxM only apply to legacy v2 (per-pixel affine) profiles.
calibration.depthCorrection.enabled=true
calibration.depthCorrection.stations=8
calibration.depthCorrection.framesPerStation=30
calibration.depthCorrection.minimumStationsPerPixel=5
calibration.depthCorrection.distanceSeparationM=0.14
calibration.depthCorrection.stabilityToleranceM=0.015
calibration.depthCorrection.planeResidualMaxM=0.018
calibration.depthCorrection.slopeMin=0.92
calibration.depthCorrection.slopeMax=1.08
calibration.depthCorrection.offsetMaxM=0.060
calibration.depthCorrection.noiseFloorM=0.0015
calibration.depthCorrection.noiseCeilingM=0.016
calibration.depthCorrection.trimFraction=0.20
calibration.depthCorrection.flyingPixelSigma=6.0
calibration.depthCorrection.gridX=40
calibration.depthCorrection.gridY=30
calibration.depthCorrection.depthBins=8
calibration.depthCorrection.regularization=0
calibration.depthCorrection.referenceMatchTolerance=0.12
calibration.depthCorrection.referenceMaxScaleError=0.10

# Fusion / mesh
fusion.volumeSize=192
fusion.voxelSizeM=0.0030
fusion.truncationM=0.012
mesh.minimumWeight=2
# Marching cubes surface extraction (as KinectFusion Explorer / Skanect). false
# restores the legacy 6-tetrahedra split (about 2.5x more triangles).
mesh.marchingCubes=true
mesh.cleanupMaxEdgeM=0.10
mesh.cleanupMinAreaM2=0.00000010
mesh.weldToleranceM=0.0010
mesh.smoothIterations=2
mesh.smoothLambda=0.30
# Automatic final polish: clean components + Taubin lambda/mu smoothing.
mesh.polishIterations=3
mesh.polishLambda=0.22
mesh.polishMu=-0.225
# Smooth closes only small depth-dropout holes; large/open partial-scan borders stay intact.
mesh.holeFill.enabled=true
mesh.holeFill.maxEdges=18
mesh.holeFill.maxDiameterM=0.030
mesh.holeFill.maxPerimeterM=0.090
mesh.minimumComponentTriangles=32
mesh.minimumComponentRatio=0.002
# Kinect RGB/depth registration and temporal surface-color fusion.
# Registration is depth dependent: each metric depth sample is back-projected,
# transformed into the RGB camera coordinate system, lens-distorted/projected,
# occlusion checked, then bilinearly sampled. offsetX/Y are fine alignment offsets.
mesh.rgb.enabled=true
mesh.rgb.offsetX=0
mesh.rgb.offsetY=0
mesh.rgb.maxSyncSkewMs=22
mesh.rgb.occlusionFilter=true
mesh.rgb.occlusionToleranceM=0.025
mesh.rgb.autoRefine=true
mesh.rgb.refineEveryFrames=6
mesh.rgb.refineSearchPx=5
mesh.rgb.refineSampleStep=8
mesh.rgb.refineEdgeThresholdMm=65
mesh.rgb.refineMinimumEdges=48
mesh.rgb.refineAlpha=0.08
mesh.rgb.refineMaxOffsetPx=6
# Exposure-quality weighting does not invent pixels. Well-exposed synchronized
# views receive more color weight, so keeping the object in view longer improves
# the final surface colors through multi-view temporal fusion.
mesh.rgb.exposureLowLuma=24
mesh.rgb.exposureHighLuma=235
mesh.rgb.temporalColorWeightMax=8

# HQ color keyframes. Kinect Xbox 360 exposes raw Bayer 1280x1024 at a lower frame
# rate than VGA. The Scanner negotiates HQ only after its module is explicitly
# selected. If the sensor does not produce a complete HQ frame during probation,
# the bridge falls back in-place to RGB VGA while Depth remains 640x480/30 fps.
# Optional internal HQ keyframes for reconstruction. This is not the virtual-camera driver setting and has no Scanner UI control.
mesh.rgb.hq.historyFrames=8
mesh.rgb.hq.maxSyncSkewMs=90
mesh.rgb.hq.minimumFrameQuality=0.22
mesh.rgb.hq.photometricNormalize=true
mesh.rgb.hq.gainMin=0.72
mesh.rgb.hq.gainMax=1.38
mesh.rgb.hq.sharpenAmount=0.16

# Representative Kinect Xbox 360 RGB calibration profile. Replace these values with a
# per-device stereo calibration for the best possible alignment.
calibration.rgb.fx=529.215081
calibration.rgb.fy=525.563936
calibration.rgb.cx=328.942720
calibration.rgb.cy=267.480682
calibration.depth.k1=-0.263864
calibration.depth.k2=0.999668
calibration.depth.p1=-0.000762
calibration.depth.p2=0.005035
calibration.depth.k3=-1.305362
# Depth pixel convention: normalized x = (u + pixelCenter + depthShiftU - cx) / fx.
# depthShiftU/V: Kinect 360 depth-to-IR image offset in pixels (IR = depth + shift).
# Literature reports a few pixels (Khoshelham & Elberink 2012, Smisek et al. 2011) but the
# sign depends on how cx/cy were calibrated; keep 0 unless measured for these intrinsics.
calibration.depth.pixelCenter=0
calibration.depthShiftU=0
calibration.depthShiftV=0
calibration.rgb.k1=0.207966
calibration.rgb.k2=-0.586138
calibration.rgb.p1=0.000722
calibration.rgb.p2=0.001048
calibration.rgb.k3=0.498570
calibration.depthToRgb.r00=0.9998463
calibration.depthToRgb.r01=0.0012635
calibration.depthToRgb.r02=-0.0174872
calibration.depthToRgb.r10=-0.0014779
calibration.depthToRgb.r11=0.9999239
calibration.depthToRgb.r12=-0.0122514
calibration.depthToRgb.r20=0.0174704
calibration.depthToRgb.r21=0.0122753
calibration.depthToRgb.r22=0.9997720
calibration.depthToRgb.tx=0.01998524
calibration.depthToRgb.ty=-0.00074424
calibration.depthToRgb.tz=-0.01091674

# Rotation / coverage rules
scan.fullTurnDeg=360
scan.completeDeg=358
scan.rotationDeadbandDeg=0.05
scan.rotationMaxStepDeg=24
scan.directionLockDeg=1.2
scan.turnFilterAlpha=0.52
scan.reverseJitterDeg=1.20
scan.reverseCommitDeg=4.0
scan.directionRelockDeg=20.0
scan.maxSensorTiltDriftDeg=10
scan.autoPauseOnFullTurn=true

# Export
export.baseName=SynKinectScan

# Canonical RGBD synchronization policy. Scanner and Interactivity use the same
# pairing rules and calibration math, but each module owns its own live transport.
# Reconstruction is latency-bounded: stale queued pairs are discarded in favor of newer data.
transport.rgbdQueueFrames=3
transport.rgbdSyncHistoryFrames=6
transport.rgbdSyncMaxResidualMs=22
transport.rgbdSyncBootstrapMaxSkewMs=180
transport.rgbdSyncOffsetAlpha=0.06
transport.drainFramesPerDraw=10

# Compact export. Vertices are welded/indexed and PLY is written as binary LE.
# STL is additionally reduced through vertex clustering up to this tolerance.
export.weldToleranceM=0.0010
export.maxWeldToleranceM=0.004
export.maxTriangles=600000

# Pose acceptance and adaptive fusion. These limits protect the TSDF from
# single-frame tracking jumps and avoid repeatedly integrating nearly identical views.
tracking.maxTranslationStepM=0.14
tracking.maxRotationStepDeg=32.0
fusion.minimumTranslationM=0.0075
fusion.minimumRotationDeg=0.85
fusion.maximumIdleFrames=30
# Fusion V6: global TSDF alignment is paid only by integration keyframes.
# Accepted corrections rebase the lightweight rolling ICP so drift does not return.
fusion.keyframeModel.maxCorrectionM=0.10
fusion.keyframeModel.maxCorrectionDeg=10.0
fusion.keyframeModel.minOverlap=0.15
fusion.keyframeModel.maxRmsM=0.014
fusion.keyframeModel.rebaseTranslationM=0.0035
fusion.keyframeModel.rebaseRotationDeg=0.40
# Strict capture-archive validation. Live ICP may keep running through an
# uncertain frame, but only poses that agree with accepted scan geometry become
# reconstruction keyframes. This is the main anti-double-shell gate.
fusion.archiveGate.enabled=true
fusion.archiveGate.warmupKeyframes=3
fusion.archiveGate.referenceFrames=6
fusion.archiveGate.refineIterations=7
fusion.archiveGate.refineDistanceM=0.038
fusion.archiveGate.minOverlap=0.20
fusion.archiveGate.maxRmsM=0.013
fusion.archiveGate.maxCorrectionM=0.045
fusion.archiveGate.maxCorrectionDeg=5.5
fusion.archiveGate.rebaseTranslationM=0.0025
fusion.archiveGate.rebaseRotationDeg=0.30

# Coverage is measured from actually observed angular sectors instead of only
# accumulating signed rotation, so small back-and-forth motion cannot fake a full turn.
scan.coverageBins=72
scan.coverageRequired=0.98

# Coarse-to-fine ICP keeps initial correspondence capture tolerant and tightens
# the last iterations for a cleaner final pose.
tracking.icpFinalDistanceM=0.024

# TSDF volume sizing (geometry), not viewport zoom. This remains active during
# acquisition because it controls reconstruction capacity, not presentation scale.
# Small objects retain the configured voxels; larger objects increase voxel size only as needed.
fusion.autoFit=true
fusion.autoFitPadding=1.15
fusion.maxVoxelSizeM=0.008
# Projective TSDF integration (KinectFusion): each voxel near the observed surface
# is projected into the depth image and updated once per frame with the signed
# distance measured at its own position. Only 8^3 voxel blocks crossed by the
# truncation band are visited. carveMarginM extends free-space carving in front
# of the surface to erase floating noise.
fusion.projectiveIntegration=true
fusion.carveMarginM=0.012
# Frame-to-model data association: final correspondence gate and the maximum
# sideways offset of a model match (larger offsets mean a surface the model has
# not seen yet; such pairs would pull the pose back toward the previous view).
fusion.modelTracking.finalGateM=0.010
fusion.modelTracking.maxTangentialM=0.006
# Kinect Fusion reconstruction cube around the subject framed before Scan
# (KinectFusion Explorer's fixed volume / Skanect's bounding box). The coarse
# whole-scene model keeps tracking robust; only this cube becomes the mesh.
fusion.targetVolume.enabled=true
fusion.targetVolume.minSideM=0.50
fusion.targetVolume.padding=1.25
# Coarse fixed TSDF used for camera tracking around the detailed subject cube.
fusion.targetVolume.trackingPadding=1.65

# Live 3D reconstruction preview. This surface is extracted from the same TSDF
# volume used for final STL/OBJ/PLY output; it is never a rotated camera image.
preview.meshMinimumWeight=2
preview.meshRefreshFrames=6
preview.meshRefreshMs=350
preview.meshMaxTriangles=90000
# Live Scan preview remains a registered point-cloud reconstruction.
preview.pointVoxelM=0.0040
preview.pointMaxPoints=52000
preview.pointDisplayMaxPoints=16000
preview.pointTransientMaxPoints=1800
preview.pointRefreshMs=120
# Viewport auto-fit is used only while idle/live-detection and for finalized output.
# Turntable capture locks it completely. Fusion capture locks it too, allowing only
# a one-way emergency zoom-out if genuinely expanded geometry would leave the view.
preview.autoFit.zoomOutResponse=0.060
preview.autoFit.zoomInResponse=0.008
preview.autoFit.centerResponse=0.020
preview.autoFit.deadband=0.100
preview.autoFit.shrinkDelayFrames=60

# Confidence-aware real-time fusion. Weak frames are rejected or integrated
# sparsely so they cannot roughen a stable TSDF surface.
fusion.minimumFrameQuality=0.44
fusion.fullWeightQuality=0.82
fusion.lowQualityStride=2
# Reject double-shell/ghost frames. Only voxels already observed by the TSDF are
# judged; genuinely new sides of the rotating object remain free to extend coverage.
fusion.surfaceMinKnownRatio=0.12
fusion.surfaceMinAgreement=0.74
fusion.surfaceMaxResidualM=0.0038
fusion.surfaceAgreementBandM=0.006
fusion.surfaceMinWeight=2
# Accepted rolling-model clouds catch a displaced shell even when it falls outside
# the local TSDF truncation band. Low overlap is allowed for genuinely new views.
fusion.referenceMinOverlap=0.12
fusion.referenceMaxRmsM=0.009

# Turntable reconstruction consensus. For an object rotating around its own axis,
# the recorded sweep angle is a strong prior. Reliable ICP may correct the prior;
# weak/recovered frames are pulled back toward the fixed-axis trajectory and get
# very little TSDF weight. Rejected frames are rescued only with real surface support.
quality.turntableConsensus.enabled=true
quality.turntableConsensus.axisAuthority=0.90
quality.turntableConsensus.rescueMinSupport=0.44
quality.turntableConsensus.rescueMaxRmsM=0.009
quality.turntableConsensus.recoveredFramePenalty=0.45

# Kinect Fusion frame-to-model tracking. Realtime point-to-plane ICP uses a
# bounded cache sampled from the TSDF near-surface zero crossing. Full TSDF
# raycast consistency is retained for relocalization validation. The rolling
# cloud map is only a recovery fallback and must agree with the TSDF afterwards.
fusion.modelTracking.enabled=true
fusion.modelTracking.minWeight=2
fusion.modelTracking.iterations=7
fusion.modelTracking.maxSamples=2200
fusion.modelTracking.minMatches=100
fusion.modelTracking.minOverlap=0.14
fusion.modelTracking.maxRmsM=0.014
fusion.modelTracking.raycastSearchM=0.18
fusion.modelTracking.raycastStepScale=0.75
fusion.relocalize.minOverlap=0.14
fusion.relocalize.maxRmsM=0.016
# Sparse keyframe pose finder, analogous to Kinect Fusion camera-pose recovery.
fusion.poseFinder.enabled=true
fusion.poseFinder.maxPoses=24
fusion.poseFinder.maxCandidates=10
fusion.poseFinder.minTranslationM=0.055
fusion.poseFinder.minRotationDeg=5.0
fusion.coverage.matureWeight=10
fusion.coverage.viewBins=24
fusion.coverage.refreshFrames=8
fusion.dynamicExpansion=false
fusion.dynamicExpansionCheckFrames=12
fusion.poseDeadbandTranslationM=0.0075
fusion.poseDeadbandRotationDeg=0.85
fusion.trajectoryMinStepM=0.012
fusion.bootstrapFrames=2

# Real-time reconstruction scheduling and bounded model caches
fusion.adaptiveCadence=true
fusion.targetUtilization=0.72
fusion.maxAdaptiveIntervalMs=220
fusion.modelTracking.cacheMaxPoints=10000
fusion.modelTracking.cacheRefreshTouched=1800
fusion.modelTracking.cacheCellM=0.014
tracking.icpReciprocalFinalIterations=2
tracking.turntable.seedSearchEveryFrames=1
fusion.modelTracking.cacheRefreshIntegrations=3
