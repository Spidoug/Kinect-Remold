ui.frameRate=30
# Studio UI typography is resolved against installed system fonts at runtime.
lifecycle.workerJoinMs=1500
# SynKinect 3D Scanner runtime configuration.

# Metric depth / Kinect calibration
# Near-object policy: do not discard valid short-range samples. The physical
# Kinect 1414 optical minimum still applies; software cannot invent depth where
# the sensor returns 0/invalid.
depth.minM=0.20
depth.maxM=4.50
depth.plausibleMinMm=180
depth.plausibleMaxMm=6000
depth.minimumValidPixels=1200
depth.minimumValidRatio=0.004
depth.histogramBinMm=20
calibration.depth.fx=594.2143421192325
calibration.depth.fy=591.0405369687078
calibration.depth.cx=339.30780975300314
calibration.depth.cy=242.73913761751615
calibration.depth.scale=0.001

# Foreground target acquisition
target.bandM=0.20
target.maxBandM=0.34
target.smoothing=0.12
target.stableToleranceM=0.12
target.maxJumpM=0.24
target.minimumConfidence=0.040
target.minimumSamples=80
target.stableFrames=3
target.reacquireFrames=6
target.roi.left=0.24
target.roi.right=0.76
target.roi.top=0.20
target.roi.bottom=0.80
target.roi.sampleStep=2
target.preferredWindowM=0.24
# Keep target depth-band growth controlled. The previous 3x spread expansion
# could reach almost one meter total depth and merge the object with support/background.
target.bandSpreadMultiplier=1.80
# Segmentation may extend beyond the acquisition ROI, but not across the full FOV.
target.segmentationMargin=0.10

# Transport liveness
transport.streamStaleMs=2400
transport.connectionStaleMs=7000
transport.reconnectMs=180

fusion.queueFrames=4
fusion.maxFps=8

# Point cloud / ICP
# Real-time profile: fusion keeps TSDF resolution but samples every second depth pixel.
# ICP cell size matches max correspondence distance, avoiding a 7x7x7 hash search.
cloud.previewStep=3
cloud.integrationStep=2
cloud.spatialFilter=true
cloud.neighborToleranceM=0.045
cloud.minimumConfidence=0.18
cloud.edgeSoftM=0.010
cloud.edgeRejectM=0.026
cloud.surfaceNoiseM=0.010
cloud.minimumSupport=0.62
# Keep only the dominant connected target surface inside the depth band. This
# prevents same-depth background islands from entering ICP/TSDF during a turn.
cloud.connectedTarget=true
cloud.componentMinSamples=70
# Neighboring pixels only belong to one 3D component when their metric depth is
# continuous. This breaks false object<->table/wall bridges at occlusion edges.
cloud.componentDepthLinkM=0.045
cloud.componentBorderPenalty=0.42
tracking.minimumPoints=320
tracking.icpIterations=11
tracking.icpMinimumMatches=100
tracking.icpCellSizeM=0.055
tracking.icpMaxDistanceM=0.055
tracking.icpMaxSamples=5200
tracking.icpGoodRmsM=0.022
# Realtime ICP tracks against a short rolling world-space model instead of only
# the immediately previous frame. Trimmed correspondences reduce outlier-driven
# pose jumps on reflective edges and structured-light dropouts.
tracking.icpReferenceFrames=6
tracking.icpReferenceMaxPoints=14000
tracking.icpTrimFraction=0.70
# Require real geometric overlap; new/occluded surfaces may change while the object turns.
tracking.icpMinimumOverlap=0.22
# Tukey-style robust weighting radius as a fraction of the current correspondence gate.
tracking.icpRobustK=0.62
tracking.icpReciprocal=true
tracking.icpReciprocalToleranceM=0.016
# True 3D frame composition. ICP estimates and accumulates the complete rigid
# transform (XYZ translation + pitch/yaw/roll) before TSDF integration. This is
# the normal scanner mode and prevents depth surfaces from being flattened into
# a 2D card that only rotates around one vertical axis.
# Turntable assistance is retained only as a coarse-to-fine yaw INITIAL GUESS.
# Full 6-DoF ICP is still allowed to refine all rotational/translational axes.
tracking.turntable.enabled=true
tracking.turntable.maxSeedYawDeg=36.0
tracking.turntable.coarseStepDeg=4.0
tracking.turntable.fineStepDeg=0.75
tracking.turntable.motionAlpha=0.62
tracking.turntable.predictionWeight=0.22
tracking.turntable.seedMinGain=0.004
tracking.turntable.seedMinimumConfidence=0.10
tracking.turntable.seedPoseAuthority=0.72
tracking.turntable.seedMinTrackedYawDeg=0.10
tracking.turntable.velocityClampDeg=10.0
tracking.turntable.pivotAlpha=0.005
# Legacy yaw-only pose projection. Keep disabled for real 3D reconstruction.
tracking.turntable.evaluationDistanceM=0.040
# A rotating subject/object is regularized around the locked vertical axis.
# Free SE(3) is kept only when it explains the depth surface materially better.
tracking.turntable.poseConstraint=true
tracking.turntable.constraintScoreSlack=0.12
tracking.turntable.constraintTranslationM=0.006
tracking.turntable.constraintTranslationAuthority=0.18

# Turntable object isolation: fixed metric Volume Of Interest (camera space).
# The first valid target locks the box. Keep the rotating base/markers inside it.
tracking.boundingBox.enabled=true
tracking.boundingBox.marginM=0.045
tracking.boundingBox.depthMarginM=0.035
tracking.boundingBox.baseExtraM=0.075
tracking.boundingBox.minWidthM=0.24
tracking.boundingBox.minHeightM=0.24
tracking.boundingBox.minDepthM=0.16
tracking.boundingBox.maxWidthM=0.90
tracking.boundingBox.maxHeightM=1.20
tracking.boundingBox.maxDepthM=0.70
tracking.boundingBox.centerFollowAlpha=0.015
tracking.boundingBox.maxCenterCorrectionM=0.035
tracking.boundingBox.minPoints=140

# Hybrid geometry/color ICP. Geometry stays authoritative; RGB only weights
# otherwise valid metric correspondences and is ignored when RGB is unavailable.
tracking.colorIcp.enabled=true
tracking.colorIcp.weight=0.28
tracking.colorIcp.rejectDistance=0.62
tracking.colorIcp.minimumWeight=0.22

# Y has low authority when selecting yaw; full 6DoF ICP still captures real height variation.
tracking.turntable.verticalResidualWeight=0.16

# Offline reconstruction. Build Mesh and Refine HQ do not trust the live TSDF pose
# history blindly: retained RGB-D keyframes are globally re-registered first, bad
# poses are recovered/rejected, and a fresh TSDF is fused from the corrected set.
quality.enabled=true
quality.keyframes.max=160
quality.keyframes.minRotationDeg=1.5
quality.keyframes.minTranslationM=0.003
quality.keyframes.minimum=16
quality.finalizeMaxKeyframes=112
quality.integrationStep=1
quality.volumeSize=224
quality.voxelSizeM=0.0020
quality.truncationM=0.0075
quality.meshMinimumWeight=5
quality.icpIterations=12
quality.icpMaxSamples=10000
quality.icpMinimumMatches=260
quality.icpMaxDistanceM=0.022
quality.icpTrimFraction=0.70
quality.icpGoodRmsM=0.008
# Global pose recovery uses the recorded sweep angle only as a geometric prior.
# ICP is free to repair substantial realtime drift, but must remain inside a broad
# physical envelope and agree with neighboring keyframes before final fusion.
quality.globalRecovery.enabled=true
quality.globalRecovery.passes=3
quality.globalRecovery.neighborFrames=6
quality.globalRecovery.coarseDistanceM=0.075
quality.globalRecovery.fineDistanceM=0.026
quality.globalRecovery.maxTranslationM=0.18
quality.globalRecovery.maxRotationDeg=36.0
quality.globalRecovery.minSupport=0.26
quality.globalRecovery.maxRmsM=0.016
quality.loopClosure=true
quality.loopClosureMaxRmsM=0.016
quality.depthFilterRadius=2
quality.depthEdgeToleranceM=0.020
quality.holeFillMinimumNeighbors=12
quality.distanceWeightedTsdf=true
# Multi-frame depth super-resolution. Neighboring calibrated keyframes are
# transformed into a common anchor camera after global pose refinement and
# accumulated on a 2x subpixel grid. Foreground z-buffering rejects occluded
# background samples; a tighter temporal gate rejects inconsistent depth.
quality.depthSuperResolution.enabled=true
quality.depthSuperResolution.scale=2
quality.depthSuperResolution.windowFrames=5
quality.depthSuperResolution.anchorStride=2
quality.depthSuperResolution.maxRotationDeg=6.0
quality.depthSuperResolution.maxTranslationM=0.030
quality.depthSuperResolution.occlusionToleranceM=0.010
quality.depthSuperResolution.outlierToleranceM=0.007
quality.depthSuperResolution.minimumViews=4
quality.depthSuperResolution.maxPoints=420000
# Keep final smoothing deliberately light: the higher-resolution TSDF should
# preserve small features while limiting aggressive smoothing.
quality.meshPolishIterations=1
quality.meshPolishLambda=0.18
quality.meshPolishMu=-0.19

# Per-device Kinect Xbox 360 depth calibration. A flat wall is sampled at multiple
# distances; the Studio fits an affine calibration and temporal noise estimate
# for every depth pixel and stores the profile by stable device ID.
# Sensor sensitivity calibration learns per-pixel depth bias and noise confidence.
# Enabled by default; run sensor calibration for each Kinect.
calibration.depthCorrection.enabled=true
calibration.depthCorrection.stations=8
calibration.depthCorrection.framesPerStation=18
calibration.depthCorrection.minimumStationsPerPixel=5
calibration.depthCorrection.distanceSeparationM=0.14
calibration.depthCorrection.stabilityToleranceM=0.015
calibration.depthCorrection.planeResidualMaxM=0.018
calibration.depthCorrection.slopeMin=0.92
calibration.depthCorrection.slopeMax=1.08
calibration.depthCorrection.offsetMaxM=0.060
calibration.depthCorrection.noiseFloorM=0.0015
calibration.depthCorrection.noiseCeilingM=0.016

# Fusion / mesh
fusion.volumeSize=192
fusion.voxelSizeM=0.0030
fusion.truncationM=0.012
mesh.minimumWeight=2
mesh.cleanupMaxEdgeM=0.10
mesh.cleanupMinAreaM2=0.00000010
mesh.weldToleranceM=0.0010
mesh.smoothIterations=2
mesh.smoothLambda=0.30
# Automatic final polish: clean components + Taubin lambda/mu smoothing.
mesh.polishIterations=3
mesh.polishLambda=0.22
mesh.polishMu=-0.225
# Smooth closes only small depth-dropout holes; large/open partial-scan borders stay intact.
mesh.holeFill.enabled=true
mesh.holeFill.maxEdges=18
mesh.holeFill.maxDiameterM=0.030
mesh.holeFill.maxPerimeterM=0.090
mesh.minimumComponentTriangles=32
mesh.minimumComponentRatio=0.002
# Kinect RGB/depth registration and temporal surface-color fusion.
# Registration is depth dependent: each metric depth sample is back-projected,
# transformed into the RGB camera coordinate system, lens-distorted/projected,
# occlusion checked, then bilinearly sampled. offsetX/Y are fine alignment offsets.
mesh.rgb.enabled=true
mesh.rgb.offsetX=0
mesh.rgb.offsetY=0
mesh.rgb.maxSyncSkewMs=22
mesh.rgb.occlusionFilter=true
mesh.rgb.occlusionToleranceM=0.025
mesh.rgb.autoRefine=true
mesh.rgb.refineEveryFrames=6
mesh.rgb.refineSearchPx=5
mesh.rgb.refineSampleStep=8
mesh.rgb.refineEdgeThresholdMm=65
mesh.rgb.refineMinimumEdges=48
mesh.rgb.refineAlpha=0.08
mesh.rgb.refineMaxOffsetPx=6
# Exposure-quality weighting does not invent pixels. Well-exposed synchronized
# views receive more color weight, so keeping the object in view longer improves
# the final surface colors through multi-view temporal fusion.
mesh.rgb.exposureLowLuma=24
mesh.rgb.exposureHighLuma=235
mesh.rgb.temporalColorWeightMax=8

# HQ color keyframes. Kinect Xbox 360 exposes raw Bayer 1280x1024 at a lower frame
# rate than VGA. The Scanner negotiates HQ only after its module is explicitly
# selected. If the sensor does not produce a complete HQ frame during probation,
# the bridge falls back in-place to RGB VGA while Depth remains 640x480/30 fps.
# Optional internal HQ keyframes for reconstruction. This is not the virtual-camera driver setting and has no Scanner UI control.
mesh.rgb.hq.historyFrames=8
mesh.rgb.hq.maxSyncSkewMs=90
mesh.rgb.hq.minimumFrameQuality=0.22
mesh.rgb.hq.photometricNormalize=true
mesh.rgb.hq.gainMin=0.72
mesh.rgb.hq.gainMax=1.38
mesh.rgb.hq.sharpenAmount=0.16

# Representative Kinect Xbox 360 RGB calibration profile. Replace these values with a
# per-device stereo calibration for the best possible alignment.
calibration.rgb.fx=529.215081
calibration.rgb.fy=525.563936
calibration.rgb.cx=328.942720
calibration.rgb.cy=267.480682
calibration.depth.k1=-0.263864
calibration.depth.k2=0.999668
calibration.depth.p1=-0.000762
calibration.depth.p2=0.005035
calibration.depth.k3=-1.305362
calibration.rgb.k1=0.207966
calibration.rgb.k2=-0.586138
calibration.rgb.p1=0.000722
calibration.rgb.p2=0.001048
calibration.rgb.k3=0.498570
calibration.depthToRgb.r00=0.9998463
calibration.depthToRgb.r01=0.0012635
calibration.depthToRgb.r02=-0.0174872
calibration.depthToRgb.r10=-0.0014779
calibration.depthToRgb.r11=0.9999239
calibration.depthToRgb.r12=-0.0122514
calibration.depthToRgb.r20=0.0174704
calibration.depthToRgb.r21=0.0122753
calibration.depthToRgb.r22=0.9997720
calibration.depthToRgb.tx=0.01998524
calibration.depthToRgb.ty=-0.00074424
calibration.depthToRgb.tz=-0.01091674

# Rotation / coverage rules
scan.fullTurnDeg=360
scan.completeDeg=358
scan.rotationDeadbandDeg=0.08
scan.rotationMaxStepDeg=24
scan.directionLockDeg=2.0
scan.turnFilterAlpha=0.38
scan.reverseJitterDeg=1.20
scan.reverseCommitDeg=3.0
scan.directionRelockDeg=14.0
scan.maxSensorTiltDriftDeg=10
scan.autoPauseOnFullTurn=true
scan.autoFinalizeOnFullTurn=false

# Export
export.baseName=SynKinectScan

# Canonical RGBD synchronization policy. Scanner and Interactivity use the same
# pairing rules and calibration math, but each module owns its own live transport.
# Reconstruction is latency-bounded: stale queued pairs are discarded in favor of newer data.
transport.rgbdQueueFrames=3
transport.rgbdSyncHistoryFrames=6
transport.rgbdSyncMaxResidualMs=22
transport.rgbdSyncBootstrapMaxSkewMs=180
transport.rgbdSyncOffsetAlpha=0.06
transport.drainFramesPerDraw=10

# Compact export. Vertices are welded/indexed and PLY is written as binary LE.
# STL is additionally reduced through vertex clustering up to this tolerance.
export.weldToleranceM=0.0010
export.maxWeldToleranceM=0.004
export.maxTriangles=600000

# Pose acceptance and adaptive fusion. These limits protect the TSDF from
# single-frame tracking jumps and avoid repeatedly integrating nearly identical views.
tracking.maxTranslationStepM=0.14
tracking.maxRotationStepDeg=32.0
fusion.minimumTranslationM=0.0015
fusion.minimumRotationDeg=0.55
fusion.maximumIdleFrames=4

# Coverage is measured from actually observed angular sectors instead of only
# accumulating signed rotation, so small back-and-forth motion cannot fake a full turn.
scan.coverageBins=72
scan.coverageRequired=0.98

# Coarse-to-fine ICP keeps initial correspondence capture tolerant and tightens
# the last iterations for a cleaner final pose.
tracking.icpFinalDistanceM=0.024

# Fit the live TSDF to the first accepted object cloud. Small objects retain the
# configured 3 mm voxels; larger objects increase voxel size only as needed.
fusion.autoFit=true
fusion.autoFitPadding=1.15
fusion.maxVoxelSizeM=0.008

# Live 3D reconstruction preview. This surface is extracted from the same TSDF
# volume used for final STL/OBJ/PLY output; it is never a rotated camera image.
preview.meshMinimumWeight=2
preview.meshRefreshFrames=6
preview.meshRefreshMs=350
preview.meshMaxTriangles=90000
# Live Scan preview remains a registered point-cloud reconstruction.
preview.pointVoxelM=0.0040
preview.pointMaxPoints=90000
preview.pointDisplayMaxPoints=52000
preview.pointTransientMaxPoints=6500
# Stable viewport auto-fit: zoom-out reacts to real growth, zoom-in waits and moves
# slowly. Centering has a dead-band to stop frame-by-frame breathing.
preview.autoFit.zoomOutResponse=0.060
preview.autoFit.zoomInResponse=0.008
preview.autoFit.centerResponse=0.020
preview.autoFit.deadband=0.100
preview.autoFit.shrinkDelayFrames=60

# Confidence-aware real-time fusion. Weak frames are rejected or integrated
# sparsely so they cannot roughen a stable TSDF surface.
fusion.minimumFrameQuality=0.38
fusion.fullWeightQuality=0.78
fusion.lowQualityStride=2
# Reject double-shell/ghost frames. Only voxels already observed by the TSDF are
# judged; genuinely new sides of the rotating object remain free to extend coverage.
fusion.surfaceMinKnownRatio=0.12
fusion.surfaceMinAgreement=0.68
fusion.surfaceMaxResidualM=0.0038
fusion.surfaceAgreementBandM=0.006
fusion.surfaceMinWeight=2
# Accepted rolling-model clouds catch a displaced shell even when it falls outside
# the local TSDF truncation band. Low overlap is allowed for genuinely new views.
fusion.referenceMinOverlap=0.12
fusion.referenceMaxRmsM=0.009
