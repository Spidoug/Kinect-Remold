# SynKinect Studio shell configuration
# Package default. The user-selected language is stored separately and takes priority after first selection.
app.language=en-US
app.languages=en-US,pt-BR,es-ES,fr-FR,de-DE,it-IT,ja-JP,zh-CN
ui.frameRate=60
ui.minFrameRate=30
ui.maxFrameRate=60
ui.fontScale=1.00

# Built-in Studio plugins. Remove an id to remove that module from the shell.
# External JAR plugins in the modules directory are discovered independently.
studio.modules.enabled=scanner,acoustic,microphones,surveillance,interactivity,mocap

# Cross-platform lifecycle/transport contract. These values apply equally to
# Windows named pipes and Linux Unix-domain sockets.
lifecycle.deviceRefreshMs=500
lifecycle.deviceDisappearGraceMs=10000
transport.connectTimeoutMs=5000
transport.readTimeoutMs=3000
transport.writeTimeoutMs=3000
transport.openAttempts=3
transport.retryDelayMs=150
