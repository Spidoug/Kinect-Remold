ui.frameRate=30
lifecycle.workerJoinMs=1200
# SynKinect Microphones runtime policy. Runtime tuning is centralized here.

# Runtime status
status.refreshMs=500
status.staleMs=3000
status.directory=Kinect360Remold
status.file=audio-bridge-status.txt

# Recording
record.directory=recordings
record.filePrefix=KinectMics

# Live monitor / playback
monitor.queueFrames=8
monitor.targetPeak=0.55
monitor.maxGain=64.0
monitor.gainSmoothing=0.18
monitor.lineBufferBytes=4096
playback.lineBufferBytes=8192

# Speaker self-test
speaker.frequencyHz=700
speaker.durationMs=750
speaker.amplitude=12000
speaker.fadeSamples=400
speaker.lineBufferBytes=4096
