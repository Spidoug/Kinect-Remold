# SynKinect Studio - shared SynSkeleton body-tracking library
# Each module may create an independent tracker instance. The tracker consumes
# calibrated depth frames and returns the Kinect Xbox 360/NUI 20-joint topology.
vision.minDepthMm=550
vision.maxDepthMm=3800

# Track-state hysteresis and short occlusion recovery.
tracking.acquireFrames=3
tracking.releaseFrames=18
tracking.minCoreCoverage=0.55
tracking.minBodyConfidence=0.28
pose.minCoreConfidence=0.30
pose.occlusionHoldFrames=36

# Confidence-aware One-Euro joint filter and velocity/innovation gating.
pose.filterMinAlpha=0.10
pose.filterMaxAlpha=0.90
pose.velocityAlpha=0.38
pose.maxSpeedMps=5.5
pose.oneEuroMinCutoff=1.25
pose.oneEuroBeta=1.35
pose.oneEuroDerivativeCutoff=1.0
pose.innovationGateM=0.26
pose.jitterRadiusM=0.010

# Multi-frame robust consensus rejects isolated joint spikes before low-pass filtering.
consensus.window=5
consensus.madScale=2.8
consensus.minRadiusM=0.012
consensus.maxBlend=0.48

# Coherent torso/root stabilization translates the full articulated pose together,
# reducing stationary body shimmer without independently deforming every joint.
root.minCutoff=1.15
root.beta=0.62
root.derivativeCutoff=1.0
root.maxCorrectionM=0.032

# Native Body3D anthropometric and temporal constraints.
pose.boneLearnAlpha=0.040
pose.boneCorrection=0.78
pose.maxDirectionJumpDeg=68
pose.fullResolutionRefineRadiusPx=7
pose.fullResolutionDepthToleranceMm=95

# Multi-hypothesis depth-person segmentation with temporal affinity.
body.temporalCenterPx=135
body.temporalDepthM=0.45
body.sampleStep=3
body.depthBinMm=80
body.depthBandMm=360
body.depthHypotheses=6
body.continuityMm=180
body.minSamples=90
body.minHeightPx=80
body.histogramCapSamples=1600
body.maxWidthRatio=0.98
body.centerBias=0.0
body.minAspect=0.65
body.bridgeCells=1
body.robustDepthRadiusPx=2
body.minRowCoverage=0.58
body.minFillRatio=0.055
body.temporalRejectScale=0.52
body.humanShapeWeight=0.52
body.temporalMaskWeight=0.92
body.edgeContactPenalty=0.0

# Person-identity motion prediction keeps segmentation attached to the same body
# during normal movement without letting long extrapolations capture another person.
identity.velocityAlpha=0.44
identity.maxPredictionPx=150
identity.maxPredictionM=0.38

# Constant-velocity Kalman stage. Measurement uncertainty grows with depth, which
# matches the Kinect Xbox 360 depth-noise profile better than a single fixed smoother.
kalman.processNoise=0.38
kalman.measurementNoiseM=0.016
kalman.depthNoiseScale=0.0065
kalman.velocityDamping=0.990
kalman.predictionMs=22

# Iterative articulated-body optimizer. High-confidence observations remain anchors,
# while inferred/noisy joints are pulled toward a stable learned body model.
model.iterations=10
model.observationStiffness=0.58
model.inferredStiffness=0.18
model.boneStiffness=0.72
model.torsoStiffness=0.34
model.maxCorrectionM=0.050
model.learnAlpha=0.045

# Posture classification keeps lower-body joints evidence-driven. A seated or
# cropped person remains tracked through the torso without synthesizing full legs.
posture.fullLegCoverage=0.62
posture.seatedLegCoverage=0.28
posture.lowerHoldConfidence=0.34
# Coherent 3D motion prior. Low-confidence joints follow the recent articulated
# trajectory and root motion until depth evidence becomes strong again.
motionPrior.velocityAlpha=0.34
motionPrior.lowConfidence=0.58
motionPrior.blend=0.46
motionPrior.rootBlend=0.58
motionPrior.maxPredictionM=0.090

