# SynKinect Studio — SynSkeleton runtime configuration
# Select RGB MoveNet or metric-depth SynSkeleton tracking below.
# Presentation and depth limits apply to either tracking mode when relevant.

vision.minDepthMm=550
vision.maxDepthMm=3800

# Metric body-cloud presentation around the current SynSkeleton pose.
cloud.sampleStep=2
cloud.armReserveM=1.02
cloud.verticalReserveM=1.18
cloud.depthReserveM=0.62
cloud.trackedSupportM=0.078

# Interactivity distance/reference settings for detailed SynSkeleton hand landmarks.
handsFingers.enabled=true
handsFingers.maxDepthM=2.05
handsFingers.referenceDistanceM=1.10

# Shared body tracking mode for Windows and Linux.
# RGB: MoveNet body landmarks; depth: exported SynSkeleton body and hand landmarks.
tracking.mode=rgb
tracking.rgbModel=data/skeleton/movenet.onnx
tracking.depthModel=data/skeleton/SynSkeleton.onnx
