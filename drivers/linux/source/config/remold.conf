# Kinect Xbox 360 Remold - runtime policy

# Smart Tilt of the V4L2 virtual camera. Same control law and defaults as the
# Windows virtual camera (Product.psd1 SmartTiltPolicy and camera controls).
# Motion comes from the per-frame sample of the camera service; Smart Tilt
# never polls the broker.
tilt.startup=6
smart_tilt.auto_framing=true
smart_tilt.face_cascade=/usr/share/opencv4/haarcascades/haarcascade_frontalface_default.xml
smart_tilt.tracking_speed=90
smart_tilt.dead_zone_percent=7
smart_tilt.digital_zoom_limit_percent=180
smart_tilt.stabilization=true
smart_tilt.stabilization_strength=60
smart_tilt.auto_center=true
smart_tilt.face_period_ms=40
smart_tilt.command_period_ms=90
smart_tilt.face_vertical_dead_zone_pixels=10
smart_tilt.face_error_filter_alpha=0.35
smart_tilt.accel_filter_alpha=0.30
smart_tilt.accel_correction_filter_alpha=0.30
smart_tilt.min_command_delta_degrees=1
smart_tilt.motor_settle_tolerance_degrees=1
smart_tilt.motor_settle_ms=140

# IP camera is secure-by-default: disabled and loopback-only until explicitly enabled.
ip.enabled=false
ip.bind=127.0.0.1
ip.port=8088
ip.user=admin
ip.password=
ip.fps=8
ip.jpeg_quality=78
ip.max_clients=4
# Optional stable device ID. Empty selects the first Ready camera.
ip.device_id=
